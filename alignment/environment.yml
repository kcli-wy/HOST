# Alignment environment with the verified CUDA 12.4 / GCC 12 toolchain.
# Build strings and machine paths are omitted; TensorFlow/Keras are excluded.
# PyTorch cu124 supplies its matching cuDNN and NCCL runtime wheels.
# NumPy is managed by Conda to avoid overlapping Conda/pip installations.
# After activating the new environment, configure OpenGL library discovery:
# conda env config vars set -n HOST_Alignment LIBRARY_PATH="$CONDA_PREFIX/lib"
# conda deactivate && conda activate HOST_Alignment
#
# Decord 0.6.0's upstream py3 wheel has a cp36 tag and stale RECORD hashes.
# The verified environment uses the same code with corrected wheel metadata.
# To reproduce: extract the wheel with `python -m zipfile -e <wheel> <dir>`,
# set decord-0.6.0.dist-info/WHEEL's Tag to py3-none-manylinux2010_x86_64,
# rebuild with `python -m wheel pack <dir> -d <wheelhouse>`, and install with
# `python -m pip install --force-reinstall --no-deps <rebuilt-wheel>`.
